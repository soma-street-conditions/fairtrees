# Refreshes the bundled data snapshot and redeploys.
#
# The site already pulls live data at runtime, so this is not required for the
# numbers to stay current — it keeps the offline fallback snapshot fresh, which is
# what visitors see if the City's API is down.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   a token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  your account id
name: Refresh data and deploy

on:
  schedule:
    - cron: "30 11 * * *"   # daily, 11:30 UTC — 311 publishes in daily batches
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Job-level, deliberately: a step's own `env:` block is not in scope for
    # that step's `if:`, so guarding the deploy on `env.CLOUDFLARE_API_TOKEN`
    # from inside the step silently skipped it on every run.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run data
      - name: Commit the refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/data; then
            echo "Snapshot unchanged."
          else
            git add public/data
            git commit -m "Refresh 311 data snapshot"
            git push
          fi
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy

      - name: Say so when the deploy was skipped
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the refreshed \
          snapshot was committed but never deployed. The live site keeps \
          serving whatever was last pushed to it."
